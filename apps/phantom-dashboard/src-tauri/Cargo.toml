[package]
name = "phantom-dashboard"
version = "0.1.0"
edition = "2021"
default-run = "phantom-dashboard"

[build-dependencies]
tauri-build = { version = "1.5.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "1.5.0", features = ["dialog-open"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "json"] }
hex = "0.4"
bech32 = "0.9"
bip39 = "1"
rand_core = "0.6"
pc-codec = { path = "../../../crates/pc-codec" }
pc-consensus = { path = "../../../crates/pc-consensus" }
pc-types = { path = "../../../crates/pc-types" }
pc-crypto = { path = "../../../crates/pc-crypto" }
phantom-signer = { path = "../../../crates/phantom-signer" }
phantom-i18n = { path = "../../../crates/phantom-i18n" }
zeroize = "1"
chrono = "0.4"

[features]
custom-protocol = ["tauri/custom-protocol"]
