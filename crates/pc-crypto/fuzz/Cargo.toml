[package]
name = "pc-crypto-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pc-crypto = { path = ".." }

[dependencies.arbitrary]
version = "1"
features = ["derive"]

[[bin]]
name = "merkle_root_varying_leaves"
path = "fuzz_targets/merkle_root_varying_leaves.rs"
test = false
doc = false

[[bin]]
name = "merkle_proof_verify"
path = "fuzz_targets/merkle_proof_verify.rs"
test = false
doc = false

[[bin]]
name = "blake3_hash"
path = "fuzz_targets/blake3_hash.rs"
test = false
doc = false
