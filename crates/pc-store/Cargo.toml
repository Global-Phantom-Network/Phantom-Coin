[package]
name = "pc-store"
version = "0.1.1"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
crc32fast = "1"
hex = "0.4"
log = "0.4"
pc-codec = { path = "../pc-codec" }
pc-types = { path = "../pc-types" }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "0.38", features = ["fs"] }

[features]
# Platzhalterfrei: keine optionalen Features vorerst
