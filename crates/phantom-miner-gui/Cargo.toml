[package]
name = "phantom-miner-gui"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Phantom Coin Mining GUI (Terminal UI)"

[[bin]]
name = "phantom-miner-gui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
ratatui = "0.29"
tokio = { version = "1.39", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
pc-crypto = { path = "../pc-crypto" }
pc-types = { path = "../pc-types" }
pc-consensus = { path = "../pc-consensus" }
pc-codec = { path = "../pc-codec" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
