[package]
name = "phantom-node"
version = "0.1.1"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1"
hex = "0.4"
hyper = { version = "0.14", features = ["server","client","http1","tcp"] }
pc-codec = { path = "../pc-codec" }
pc-types = { path = "../pc-types" }
pc-consensus = { path = "../pc-consensus" }
phantom-config = { path = "../phantom-config" }
pc-crypto = { path = "../pc-crypto" }
pc-da = { path = "../pc-da", features = ["async"] }
pc-p2p = { path = "../pc-p2p", features = ["async", "quic", "libp2p"] }
pc-store = { path = "../pc-store" }
pc-state = { path = "../pc-state" }
tokio = { version = "1.39", features = ["rt-multi-thread","macros","time","signal","net","sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9"
toml = "0.8"
once_cell = "1.19"
async-trait = "0.1"
lru = "0.16.3"
num_cpus = "1.16"
rayon = "1.10"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["std"] }
nix = { version = "0.26", default-features = false, features = ["signal"] }
rcgen = "0.13"
sysinfo = { version = "0.30", default-features = false }
pprof = { version = "0.14", optional = true, features = ["prost-codec"] }
console-subscriber = { version = "0.2", optional = true }
prost = { version = "0.12", optional = true }

[features]
default = ["rocksdb"]
rocksdb = ["pc-state/rocksdb"]
pprof = ["dep:pprof", "dep:prost"]
console = ["dep:console-subscriber"]

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
