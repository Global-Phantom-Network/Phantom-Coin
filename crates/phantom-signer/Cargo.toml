[package]
name = "phantom-signer"
version = "0.1.2"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
base64 = "0.22"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
rpassword = "7"
zeroize = "1"
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
pc-crypto = { path = "../pc-crypto" }
secp256k1 = { version = "0.28", features = ["rand-std", "global-context", "serde"] }
bech32 = "0.9"
bip32 = { version = "0.5", features = ["secp256k1"] }
serde_json = "1"
pc-types = { path = "../pc-types" }
pc-codec = { path = "../pc-codec" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
sled = "0.34"
fs2 = "0.4"
cryptoki = "0.10"
bip39 = "1"
phantom-i18n = { path = "../phantom-i18n" }
bitbox-api = { path = "../bitbox-api-rs", default-features = false, features = ["usb", "bridge"] }
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
rocksdb = "0.22"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
pc-crypto = { path = "../pc-crypto" }
hex = "0.4"
