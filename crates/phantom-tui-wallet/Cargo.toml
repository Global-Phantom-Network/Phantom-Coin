[package]
name = "phantom-tui-wallet"
version = "0.1.0"
edition = "2021"
authors = ["Phantom-Coin"]
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
ratatui = "0.29"
crossterm = "0.27"
rpassword = "7"
bech32 = "0.9"
hex = "0.4"
rand = "0.8"
toml = "0.8"
bitcoin = "0.32"
secp256k1 = { version = "0.29", features = ["global-context"] }
phantom-signer = { path = "../phantom-signer" }
phantom-i18n = { path = "../phantom-i18n" }
phantom-wallet-common = { path = "../phantom-wallet-common" }
zeroize = "1"
