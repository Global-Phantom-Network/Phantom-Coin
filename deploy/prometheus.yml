global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'prometheus:9090'

  - job_name: 'phantom-status'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'node1-status:18081'
          - 'node2-status:18082'
          - 'node3-status:18083'
